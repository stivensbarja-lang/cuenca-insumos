[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cuenca-insumos"
version = "0.1.0"
description = "Identifica, selecciona y descarga automáticamente los insumos geoespaciales para el análisis de una cuenca hidrográfica a partir de su punto de salida."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Barja Stivens" }]
keywords = ["cuencas", "hidrologia", "SIG", "DEM", "Copernicus", "HydroSHEDS", "QGIS", "Peru"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Natural Language :: Spanish",
]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cuenca-insumos = "cuenca_insumos.cli:main"

[project.gui-scripts]
cuenca-insumos-ventana = "cuenca_insumos.gui:main"

[project.urls]
Repositorio = "https://github.com/stivensbarja-lang/cuenca-insumos"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "red: requiere conexión a internet",
    "huacara: requiere los datos del caso de estudio del río Huacará",
]
