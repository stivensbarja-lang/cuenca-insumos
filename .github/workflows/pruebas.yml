# Corre las pruebas en Windows, Linux y macOS con la versión mínima y las más usadas de
# Python cada vez que se suben cambios. Así se detecta a tiempo lo que falla «en otra computadora».
name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Diagnóstico
        run: python diagnostico.py --rapido
      - name: Pruebas
        run: python -m pytest -q
      - name: La terminal responde
        run: python -m cuenca_insumos --version
